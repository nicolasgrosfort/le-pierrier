name: Deploy on production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build:all

      - name: Deploy with rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          sshpass -p "${{ secrets.SFTP_PASSWORD }}" \
            rsync -avz --delete \
            -e "ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='node_modules' \
            dist/ package.json yarn.lock \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/srv/customer/sites/pierrier.panstructure.ch/

      - name: Install production dependencies
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" \
            ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }} \
            "cd /srv/customer/sites/pierrier.panstructure.ch && yarn install --production --frozen-lockfile"
