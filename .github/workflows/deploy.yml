name: Deploy on production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Deploy with rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          sshpass -p "${{ secrets.SFTP_PASSWORD }}" \
            rsync -avz --delete \
            -e "ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='.github' \
            ./ \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/srv/customer/sites/pierrier.panstructure.ch/

      - name: Install dependencies and build on server
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" \
            ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }} \
            "cd /srv/customer/sites/pierrier.panstructure.ch && yarn install --frozen-lockfile && yarn build:all"

      - name: Restart server
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" \
            ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }} \
            "touch /srv/customer/sites/pierrier.panstructure.ch/tmp/restart.txt"
